name: Update 3D contributions
on:
  push:
    paths:
      - .github/workflows/profile-3d.yml
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-3d
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove stars and forks counters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("profile-3d-contrib/profile-night-green.svg")
          svg = p.read_text()
          start = '<g transform="translate(608, 802), scale(2)">'
          end = '<text style="font-size: 16px;" x="1260"'
          a = svg.index(start)
          b = svg.index(end, a)
          cleaned = svg[:a] + svg[b:]
          p.write_text(cleaned)

          import json
          import re
          from urllib.request import Request, urlopen
          try:
              request = Request(
                  "https://streak-stats.demolab.com?user=AliAlj&type=json",
                  headers={"User-Agent": "AliAlj-profile"},
              )
              with urlopen(request, timeout=15) as response:
                  longest = int(json.load(response)["longestStreak"]["length"])
          except Exception:
              longest = 7

          try:
              request = Request(
                  "https://komarev.com/ghpvc/?username=AliAlj&label=views",
                  headers={"User-Agent": "AliAlj-profile"},
              )
              with urlopen(request, timeout=15) as response:
                  badge = response.read().decode()
              numbers = re.findall(r'>([0-9]+(?:\\.[0-9]+)?[kKmM]?)</text>', badge)
              views = numbers[-1] if numbers else "19"
          except Exception:
              views = "19"

          marker = '<text style="font-size: 16px;" x="1260"'
          stat = (
              '<text style="font-size: 32px; font-weight: bold;" '
              'x="820" y="830" text-anchor="end" class="fill-strong">'
              f'🔥 {longest}</text>'
              '<text style="font-size: 24px;" '
              'x="830" y="830" text-anchor="start" class="fill-fg">'
              'day streak</text>'
              '<text style="font-size: 32px; font-weight: bold;" '
              'x="1080" y="830" text-anchor="end" class="fill-strong">'
              f'🔎 {views}</text>'
              '<text style="font-size: 24px;" '
              'x="1090" y="830" text-anchor="start" class="fill-fg">'
              'views</text>'
          )
          cleaned = cleaned.replace(marker, stat + marker)
          Path("profile-3d-contrib/profile-night-green-stats.svg").write_text(cleaned)
          PY
      - name: Save calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m 'Update 3D contribution calendar'
            git pull --rebase
            git push
          fi
