name: Update 3D contributions
on:
  push:
    paths:
      - .github/workflows/profile-3d.yml
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-3d
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove stars and forks counters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("profile-3d-contrib/profile-night-green.svg")
          svg = p.read_text()
          start = '<g transform="translate(608, 802), scale(2)">'
          end = '<text style="font-size: 16px;" x="1260"'
          a = svg.index(start)
          b = svg.index(end, a)
          p.write_text(svg[:a] + svg[b:])
          PY
      - name: Save calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m 'Update 3D contribution calendar'
            git pull --rebase
            git push
          fi
