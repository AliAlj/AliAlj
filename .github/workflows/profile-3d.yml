name: Update 3D contributions
on:
  push:
    paths:
      - .github/workflows/profile-3d.yml
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-3d
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Remove stars and forks counters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("profile-3d-contrib/profile-night-green.svg")
          svg = p.read_text()
          start = '<g transform="translate(608, 802), scale(2)">'
          end = '<text style="font-size: 16px;" x="1260"'
          a = svg.index(start)
          b = svg.index(end, a)
          cleaned = svg[:a] + svg[b:]
          cleaned = (
              cleaned
              .replace(".fill-fg { fill: #eeeeff; }", ".fill-fg { fill: #24292f; }")
              .replace(".stroke-fg { stroke: #eeeeff; }", ".stroke-fg { stroke: #24292f; }")
              .replace(".fill-bg { fill: #00000f; }", ".fill-bg { fill: #ffffff; }")
              .replace(".stroke-bg { stroke: #00000f; }", ".stroke-bg { stroke: #ffffff; }")
              .replace(".fill-strong { fill: rgb(255,200,55); }", ".fill-strong { fill: #6d5bb5; }")
              .replace(".fill-weak { fill: #aaaaaa; }", ".fill-weak { fill: #57606a; }")
              .replace(".stroke-weak { stroke: #aaaaaa; }", ".stroke-weak { stroke: #d0d7de; }")
              .replace("stroke: #47a042;\\nfill: #47a042;", "stroke: #a78bfa;\\nfill: #a78bfa;")
              .replace(".cont-top-0 { fill: rgb(68, 68, 68); }", ".cont-top-0 { fill: #e8e7f2; }")
              .replace(".cont-left-0 { fill: rgb(57, 57, 57); }", ".cont-left-0 { fill: #d3d1e2; }")
              .replace(".cont-right-0 { fill: rgb(48, 48, 48); }", ".cont-right-0 { fill: #bdb9d0; }")
              .replace(".cont-top-1 { fill: rgb(27, 125, 40); }", ".cont-top-1 { fill: #5eead4; }")
              .replace(".cont-left-1 { fill: rgb(23, 105, 33); }", ".cont-left-1 { fill: #3fcbbb; }")
              .replace(".cont-right-1 { fill: rgb(19, 88, 28); }", ".cont-right-1 { fill: #2aae9f; }")
              .replace(".cont-top-2 { fill: rgb(36, 167, 54); }", ".cont-top-2 { fill: #65c7e8; }")
              .replace(".cont-left-2 { fill: rgb(30, 140, 45); }", ".cont-left-2 { fill: #4aa8ca; }")
              .replace(".cont-right-2 { fill: rgb(25, 117, 38); }", ".cont-right-2 { fill: #398baa; }")
              .replace(".cont-top-3 { fill: rgb(45, 209, 67); }", ".cont-top-3 { fill: #a78bfa; }")
              .replace(".cont-left-3 { fill: rgb(38, 175, 56); }", ".cont-left-3 { fill: #8670d0; }")
              .replace(".cont-right-3 { fill: rgb(31, 146, 47); }", ".cont-right-3 { fill: #6d5bb5; }")
              .replace(".cont-top-4 { fill: rgb(87, 218, 105); }", ".cont-top-4 { fill: #5b21b6; }")
              .replace(".cont-left-4 { fill: rgb(73, 182, 88); }", ".cont-left-4 { fill: #4c1d95; }")
              .replace(".cont-right-4 { fill: rgb(61, 153, 74); }", ".cont-right-4 { fill: #3b1674; }")
          )
          p.write_text(cleaned)

          import json
          import re
          from urllib.request import Request, urlopen
          try:
              request = Request(
                  "https://streak-stats.demolab.com?user=AliAlj&type=json",
                  headers={"User-Agent": "AliAlj-profile"},
              )
              with urlopen(request, timeout=15) as response:
                  longest = int(json.load(response)["longestStreak"]["length"])
          except Exception:
              longest = 7

          try:
              request = Request(
                  "https://komarev.com/ghpvc/?username=AliAlj&label=views",
                  headers={"User-Agent": "AliAlj-profile"},
              )
              with urlopen(request, timeout=15) as response:
                  badge = response.read().decode()
              numbers = re.findall(r'>([0-9]+(?:\\.[0-9]+)?[kKmM]?)</text>', badge)
              views = numbers[-1] if numbers else "19"
          except Exception:
              views = "19"

          contribution_pattern = (
              r'<text style="font-size: 32px; font-weight: bold;" '
              r'x="384" y="830" text-anchor="end" class="fill-strong">'
              r'([0-9]+)</text><text style="font-size: 24px;" '
              r'x="394" y="830" text-anchor="start" class="fill-fg">'
              r'contributions</text>'
          )
          contribution = (
              '<text x="360" y="830" text-anchor="middle">'
              '<tspan style="font-size: 32px; font-weight: bold;" '
              'class="fill-strong">\\1</tspan>'
              '<tspan dx="10" style="font-size: 24px;" '
              'class="fill-fg">contributions</tspan></text>'
          )
          cleaned = re.sub(contribution_pattern, contribution, cleaned)

          marker = '<text style="font-size: 16px;" x="1260"'
          stat = (
              '<text x="640" y="830" text-anchor="middle">'
              '<tspan style="font-size: 32px; font-weight: bold;" '
              f'class="fill-strong">🔥 {longest}</tspan>'
              '<tspan dx="10" style="font-size: 24px;" '
              'class="fill-fg">day streak</tspan></text>'
              '<text x="920" y="830" text-anchor="middle">'
              '<tspan style="font-size: 32px; font-weight: bold;" '
              f'class="fill-strong">🔎 {views}</tspan>'
              '<tspan dx="10" style="font-size: 24px;" '
              'class="fill-fg">views</tspan></text>'
          )
          cleaned = cleaned.replace(marker, stat + marker)
          Path("profile-3d-contrib/profile-white-astral-ordered.svg").write_text(cleaned)
          PY
      - name: Save calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m 'Update 3D contribution calendar'
            git pull --rebase
            git push
          fi
